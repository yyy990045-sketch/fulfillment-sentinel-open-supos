apiVersion: v4alpha1
service:
  multiReplicas: false
  replicas: 1
  proxy:
    paths:
      - path: /
        servicePort: 3410
  ports:
    - name: http
      port: 3410
      protocol: TCP
      targetPort: 3410
  containers:
    - name: fulfillment-sentinel
      image: fulfillment-sentinel:0.1.0
      resources:
        requests:
          memory: "256Mi"
        limits:
          memory: "768Mi"
      ports:
        - containerPort: 3410
      entrance: route
