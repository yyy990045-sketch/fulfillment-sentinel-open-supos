name: fulfillment-sentinel-open-supos

services:
  app:
    image: ${APP_IMAGE:-fulfillment-sentinel-open-supos:local}
    build: .
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3410}:3410"
    volumes:
      - type: bind
        source: ${J2_ARTIFACT_DIR:-./artifacts}
        target: /app/artifacts
        read_only: true
    environment:
      HOST: 0.0.0.0
      PORT: "3410"
      J2_MQTT_URL: ${J2_MQTT_URL:-}
      J2_MQTT_USERNAME: ${J2_MQTT_USERNAME:-}
      J2_MQTT_PASSWORD: ${J2_MQTT_PASSWORD:-}
      J2_ARTIFACT_DIR: /app/artifacts
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-}
      AI_JSON_SCHEMA: ${AI_JSON_SCHEMA:-}
